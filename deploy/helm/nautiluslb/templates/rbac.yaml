{{- if .Values.rbac.create }}
{{- $clusterName := include "nautiluslb.clusterName" . }}
{{- $sa := include "nautiluslb.serviceAccountName" . }}
{{- $labels := include "nautiluslb.labels" . }}
{{- $rules := `
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]` }}
# Nodes are cluster-scoped: NautilusLB forwards to <nodeIP>:<nodePort>.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}-nodes
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}-nodes
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}-nodes
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if include "nautiluslb.clusterWide" . }}
---
# A configuration uses namespaces ["*"]: services and endpointslices cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}-discovery
  labels:
    {{- $labels | nindent 4 }}
rules:
{{- $rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}-discovery
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $ns := include "nautiluslb.namespaces" . | fromJsonArray }}
---
# Discovery in allowlisted namespace {{ $ns }} only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $clusterName }}-discovery
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
{{- $rules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $clusterName }}-discovery
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $clusterName }}-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
