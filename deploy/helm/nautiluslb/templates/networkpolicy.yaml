{{- if .Values.networkPolicy.enabled }}
{{- $listeners := include "nautiluslb.listeners" . | fromJsonArray }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nautiluslb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nautiluslb.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nautiluslb.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    {{- if $listeners }}
    - ports:
        {{- range $listeners }}
        - port: {{ .targetPort }}
          protocol: {{ .protocol }}
        {{- end }}
      {{- with .Values.networkPolicy.listenerFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.adminFrom }}
    - ports:
        - port: {{ $.Values.admin.port }}
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
