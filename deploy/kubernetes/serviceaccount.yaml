# NautilusLB v2 raw manifests: mirrors the Helm chart defaults
# (deploy/helm/nautiluslb); `bash deploy/check-drift.sh` checks them.
#
# The identity NautilusLB uses for discovery. Its permissions are granted in
# rbac-cluster.yaml (nodes) and rbac-namespaced.yaml or rbac-clusterwide.yaml
# (services + endpointslices). It needs nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nautiluslb
  namespace: nautiluslb
  labels:
    app.kubernetes.io/name: nautiluslb
    app.kubernetes.io/instance: nautiluslb
