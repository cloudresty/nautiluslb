# NautilusLB raw manifests: mirrors the Helm chart defaults
# (deploy/helm/nautiluslb); `bash deploy/check-drift.sh` checks them.
#
# The default set:  kubectl apply -k deploy/kubernetes
#
# Not included, apply on their own when needed:
#   rbac-clusterwide.yaml  only for a configuration with namespaces: ["*"]
#                          (replaces rbac-namespaced.yaml)
#   servicemonitor.yaml    requires the prometheus-operator CRDs
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac-cluster.yaml
  - rbac-namespaced.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
