# Workloads for the NautilusLB end-to-end test (see run.sh and cases/).
#
# Every fixture is a NodePort Service, so a backend is <node InternalIP>:<nodePort>,
# the way NautilusLB is deployed in front of a cluster. Configuration names in
# the annotations are the ones the cases put in their NautilusLB config.
#
#   binding (the v1.0.1 hijack regression; config e2e_http allowlists e2e-apps):
#     bound     e2e-apps   configurations=e2e_http,...   -> MUST receive traffic
#     intruder  e2e-apps   configurations=other_config   -> must NOT (names another config)
#     outsider  e2e-other  configurations=e2e_http       -> must NOT (namespace not allowlisted)
#   All three have a port named "http", so before v1.0.1 every one of them would
#   have joined the e2e_http pool.
#
#   lb-0, lb-1, lb-2   one StatefulSet pod each, body = pod name   (balancing)
#   blob               nginx serving a 6MB deterministic file      (drain)
#   ppecho             nginx `listen proxy_protocol`, echoes the PROXY source (proxy)
#   tls-a, tls-b       nginx TLS with distinct self-signed certs   (sni; Secrets
#                      tls-a/tls-b are generated by lib.sh)
#   echo               socat TCP and UDP echo                      (reload, udp)
#
# Images are pinned by tag and digest.

apiVersion: v1
kind: Namespace
metadata:
  name: e2e-apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-other
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bound
  namespace: e2e-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: bound }
  template:
    metadata:
      labels: { app: bound }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args: ["-listen=:5678", "-text=bound"]
          ports:
            - containerPort: 5678
          readinessProbe:
            tcpSocket: { port: 5678 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: bound
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    # e2e_http_reloaded is the listener the reload case adds.
    nautiluslb.cloudresty.io/configurations: "e2e_http, e2e_http_reloaded"
spec:
  type: NodePort
  selector: { app: bound }
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intruder
  namespace: e2e-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: intruder }
  template:
    metadata:
      labels: { app: intruder }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args: ["-listen=:5678", "-text=intruder"]
          ports:
            - containerPort: 5678
          readinessProbe:
            tcpSocket: { port: 5678 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: intruder
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "other_config"
spec:
  type: NodePort
  selector: { app: intruder }
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outsider
  namespace: e2e-other
spec:
  replicas: 1
  selector:
    matchLabels: { app: outsider }
  template:
    metadata:
      labels: { app: outsider }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args: ["-listen=:5678", "-text=outsider"]
          ports:
            - containerPort: 5678
          readinessProbe:
            tcpSocket: { port: 5678 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: outsider
  namespace: e2e-other
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_http"
spec:
  type: NodePort
  selector: { app: outsider }
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
# Balancing: three pods answering with their own name, one Service per pod so
# NautilusLB sees three backends (three NodePorts on the node).
apiVersion: v1
kind: Service
metadata:
  name: lb
  namespace: e2e-apps
spec:
  clusterIP: None
  selector: { app: lb }
  ports:
    - name: http
      port: 5678
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lb
  namespace: e2e-apps
spec:
  serviceName: lb
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: lb }
  template:
    metadata:
      labels: { app: lb }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          args: ["-listen=:5678", "-text=$(POD_NAME)"]
          ports:
            - containerPort: 5678
          readinessProbe:
            tcpSocket: { port: 5678 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: lb-0
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_lc,e2e_hash"
spec:
  type: NodePort
  selector: { statefulset.kubernetes.io/pod-name: lb-0 }
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: lb-1
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_lc,e2e_hash"
spec:
  type: NodePort
  selector: { statefulset.kubernetes.io/pod-name: lb-1 }
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: lb-2
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_lc,e2e_hash"
spec:
  type: NodePort
  selector: { statefulset.kubernetes.io/pod-name: lb-2 }
  ports:
    - name: http
      port: 80
      targetPort: 5678
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: e2e-apps
data:
  ppecho.conf: |
    server {
      listen 8080 proxy_protocol;
      location / {
        default_type text/plain;
        return 200 "$proxy_protocol_addr\n";
      }
    }
  tls-a.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate     /etc/tls/tls.crt;
      ssl_certificate_key /etc/tls/tls.key;
      location / {
        default_type text/plain;
        return 200 "a\n";
      }
    }
  tls-b.conf: |
    server {
      listen 8443 ssl;
      ssl_certificate     /etc/tls/tls.crt;
      ssl_certificate_key /etc/tls/tls.key;
      location / {
        default_type text/plain;
        return 200 "b\n";
      }
    }
---
# Drain: a 6MB file the client downloads at a limited rate across a shutdown.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blob
  namespace: e2e-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: blob }
  template:
    metadata:
      labels: { app: blob }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
          command:
            - sh
            - -c
            - yes nautiluslb | head -c 6000000 > /usr/share/nginx/html/blob && exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /blob, port: 80 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: blob
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_blob"
spec:
  type: NodePort
  selector: { app: blob }
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppecho
  namespace: e2e-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: ppecho }
  template:
    metadata:
      labels: { app: ppecho }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: ppecho.conf
          readinessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 2
      volumes:
        - name: conf
          configMap: { name: nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: ppecho
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_pp_v1,e2e_pp_v2"
spec:
  type: NodePort
  selector: { app: ppecho }
  ports:
    - name: pp
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-a
  namespace: e2e-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: tls-a }
  template:
    metadata:
      labels: { app: tls-a }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: tls-a.conf
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          readinessProbe:
            tcpSocket: { port: 8443 }
            periodSeconds: 2
      volumes:
        - name: conf
          configMap: { name: nginx-conf }
        - name: tls
          secret: { secretName: tls-a }
---
apiVersion: v1
kind: Service
metadata:
  name: tls-a
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_tls/a"
spec:
  type: NodePort
  selector: { app: tls-a }
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-b
  namespace: e2e-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: tls-b }
  template:
    metadata:
      labels: { app: tls-b }
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
          ports:
            - containerPort: 8443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: tls-b.conf
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          readinessProbe:
            tcpSocket: { port: 8443 }
            periodSeconds: 2
      volumes:
        - name: conf
          configMap: { name: nginx-conf }
        - name: tls
          secret: { secretName: tls-b }
---
apiVersion: v1
kind: Service
metadata:
  name: tls-b
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_tls/b"
spec:
  type: NodePort
  selector: { app: tls-b }
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
# TCP and UDP echo. socat forks one child per TCP connection and per UDP peer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: e2e-apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: tcp
          image: alpine/socat:1.8.1.3@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
          args: ["TCP-LISTEN:7000,fork,reuseaddr", "EXEC:cat"]
          ports:
            - containerPort: 7000
              protocol: TCP
          readinessProbe:
            tcpSocket: { port: 7000 }
            periodSeconds: 2
        - name: udp
          image: alpine/socat:1.8.1.3@sha256:5ffbd6ae916cbad86a58fabe0d6d5a6fd5c2b47ddf031e82996baac9300e732f
          args: ["-T", "30", "UDP-LISTEN:7001,fork,reuseaddr", "EXEC:cat"]
          ports:
            - containerPort: 7001
              protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: e2e-apps
  annotations:
    nautiluslb.cloudresty.io/enabled: "true"
    nautiluslb.cloudresty.io/configurations: "e2e_echo,e2e_udp"
spec:
  type: NodePort
  selector: { app: echo }
  ports:
    - name: tcp-echo
      port: 7000
      targetPort: 7000
      protocol: TCP
    - name: udp-echo
      port: 7001
      targetPort: 7001
      protocol: UDP
