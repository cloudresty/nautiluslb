name: CI

# The gate every change passes: format, vet, race tests with coverage, the
# in-process integration suite, a fuzz smoke run, lint, vulnerability scan,
# Helm chart lint and drift check, a multi-arch image build and the kind-based
# end-to-end test.
#
# Runs on pushes to main/develop and on PRs against them. It publishes nothing:
# release.yaml calls this workflow (workflow_call) on a version tag and only
# publishes once every job here has passed.
#
# Third-party actions are pinned to full commit SHAs; the trailing comment is
# the release tag the SHA was resolved from (annotated tags dereferenced).

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

permissions:
  contents: read

concurrency:
  # When called from release.yaml, github.workflow is the caller's name, so the
  # group never collides with the caller's own concurrency group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0
  ACTIONLINT_VERSION: v1.7.12
  HELM_VERSION: v4.3.0
  CT_VERSION: 3.14.0

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          go vet -tags integration ./...

      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./app/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Build binary
        run: |
          go build -trimpath -o nautiluslb ./cmd/nautiluslb
          ./nautiluslb -help
          ./nautiluslb --version

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMIT_LEVEL: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Integration tests (race)
        run: make integration

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Fuzz every target for 10s
        run: make fuzz FUZZTIME=10s FUZZMINIMIZE=0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: app
          args: --timeout=5m

  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache: false

      - name: actionlint (shellcheck is preinstalled on the runner)
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}" -color

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ct inspects git history
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Python (for ct's yamllint and yamale)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: ${{ env.CT_VERSION }}

      - name: helm lint --strict
        run: |
          helm lint --strict deploy/helm/nautiluslb
          for values in deploy/helm/nautiluslb/ci/*.yaml; do
            echo "==> ${values}"
            helm lint --strict deploy/helm/nautiluslb --values "${values}"
          done

      - name: ct lint (every ci/*-values.yaml)
        run: ct lint --config .github/ct.yaml --charts deploy/helm/nautiluslb --validate-maintainers=false

      - name: Raw manifests match the chart (drift check)
        run: |
          # yq (v4) and kubectl are preinstalled on ubuntu-latest; the script
          # falls back to python3/PyYAML when yq is missing.
          yq --version || true
          kubectl version --client
          bash deploy/check-drift.sh

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The builder stage runs on the build platform and cross-compiles, and the
      # final stage has no RUN, so no QEMU is needed for arm64.
      - name: Build Docker image (all release platforms, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: cloudresty/nautiluslb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind and kubectl
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true

      - name: End-to-end test (kind)
        shell: bash # -eo pipefail, so tee does not hide the exit code
        env:
          KEEP: '1' # keep the cluster so its logs can be exported on failure
        run: |
          mkdir -p e2e-logs
          make e2e 2>&1 | tee e2e-logs/run.log

      - name: Collect e2e logs
        if: failure()
        shell: bash
        run: |
          set +e
          kind export logs --name nautiluslb-e2e e2e-logs/kind
          docker logs nautiluslb-e2e > e2e-logs/nautiluslb.log 2>&1
          docker logs nautiluslb-e2e-strict > e2e-logs/nautiluslb-strict.log 2>&1
          docker ps -a > e2e-logs/docker-ps.txt 2>&1
          exit 0

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
