name: Release

# Publishes a version tag (vX.Y.Z, or a release candidate vX.Y.Z-rc.N):
#
#   ci              the whole CI gate (ci.yaml via workflow_call); nothing is
#                   published unless every CI job passes
#   meta            tag, chart version, build date, prerelease / latest flags
#   binaries        nautiluslb-linux-{amd64,arm64} (CGO_ENABLED=0, -trimpath)
#   sign-binaries   sha256sums.txt, one SPDX SBOM per binary, cosign keyless
#                   bundles (<file>.sigstore.json) for each binary and the sums
#   image           multi-arch image to Docker Hub (provenance + SBOM
#                   attestations), cosign keyless signature on the digest
#   helm            chart pushed as OCI to ghcr.io/cloudresty/charts/nautiluslb
#                   (GITHUB_TOKEN, packages: write), cosign keyless signature
#                   on the chart digest. Not Docker Hub: helm names the repo
#                   after the chart and Docker Hub allows one level only, so
#                   the chart would land inside the cloudresty/nautiluslb
#                   image repository.
#   github-release  GitHub release with generated notes and every asset
#
# Signing is keyless: each signing job gets a short-lived certificate from
# Fulcio for this workflow's OIDC identity
#   https://github.com/cloudresty/nautiluslb/.github/workflows/release.yaml@refs/tags/<tag>
# and the signature is recorded in the Rekor transparency log.
#
# `latest` (Docker tag and GitHub "latest release") only ever moves to the
# highest final vX.Y.Z tag: a patch for an older line or any -rc tag never
# takes it.
#
# The jobs that sign or publish run in the `release` environment. A repository
# admin should configure it (Settings > Environments > release) with required
# reviewers and a deployment rule limited to tags matching v*, so a tag push
# alone cannot publish. CLR__DOCKER_HUB_USERNAME (variable) and
# CLR__DOCKER_HUB_PAT (secret) may be scoped to that environment.
#
# Third-party actions are pinned to full commit SHAs; the trailing comment is
# the release tag the SHA was resolved from (annotated tags dereferenced).

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: cloudresty/nautiluslb
  CHART_REGISTRY: oci://ghcr.io/cloudresty/charts
  HELM_VERSION: v4.3.0
  COSIGN_VERSION: v3.1.3
  VERSION_PKG: github.com/cloudresty/nautiluslb/internal/version

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  meta:
    needs: [ ci ]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      latest: ${{ steps.meta.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to decide whether this one is the highest
          persist-credentials: false

      - name: Compute release metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            prerelease=true
          else
            echo "::error::tag ${TAG} is neither vX.Y.Z nor vX.Y.Z-rc.N"
            exit 1
          fi
          highest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          latest=false
          # Never move latest backwards (a patch for an older line), never to an rc.
          if [ "${prerelease}" = false ] && [ "${TAG}" = "${highest}" ]; then
            latest=true
          fi
          # Commit time, not wall-clock time, so a rebuild of the tag is identical.
          build_date="$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          echo "tag=${TAG} highest=${highest} prerelease=${prerelease} latest=${latest} build_date=${build_date}"
          {
            echo "tag=${TAG}"
            echo "chart_version=${TAG#v}"
            echo "build_date=${build_date}"
            echo "prerelease=${prerelease}"
            echo "latest=${latest}"
          } >> "$GITHUB_OUTPUT"

  binaries:
    needs: [ meta ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: Build nautiluslb-linux-${{ matrix.arch }}
        working-directory: app
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.meta.outputs.tag }}
          COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.meta.outputs.build_date }}
        run: |
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X ${VERSION_PKG}.Version=${TAG} -X ${VERSION_PKG}.Commit=${COMMIT} -X ${VERSION_PKG}.BuildDate=${BUILD_DATE}" \
            -o "../dist/nautiluslb-linux-${GOARCH}" ./cmd/nautiluslb
          go version -m "../dist/nautiluslb-linux-${GOARCH}" | head -n 3

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/nautiluslb-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7

  sign-binaries:
    needs: [ meta, binaries ]
    if: github.repository == 'cloudresty/nautiluslb'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # cosign keyless (Fulcio certificate for this workflow)
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-linux-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          chmod 0755 nautiluslb-linux-*
          sha256sum nautiluslb-linux-amd64 nautiluslb-linux-arm64 > sha256sums.txt
          cat sha256sums.txt

      - name: SBOM (amd64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/nautiluslb-linux-amd64
          format: spdx-json
          output-file: dist/nautiluslb-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: SBOM (arm64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/nautiluslb-linux-arm64
          format: spdx-json
          output-file: dist/nautiluslb-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign binaries and checksums (keyless)
        working-directory: dist
        run: |
          for f in nautiluslb-linux-amd64 nautiluslb-linux-arm64 sha256sums.txt; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done
          ls -l

      - name: Upload signed binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [ meta ]
    if: github.repository == 'cloudresty/nautiluslb'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # cosign keyless
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tags
        id: tags
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          LATEST: ${{ needs.meta.outputs.latest }}
        run: |
          {
            echo 'list<<EOF'
            echo "${IMAGE}:${TAG}"
            if [ "${LATEST}" = true ]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.CLR__DOCKER_HUB_USERNAME }}
          password: ${{ secrets.CLR__DOCKER_HUB_PAT }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the image digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          {
            echo "### Image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`, tagged:"
            echo
            while IFS= read -r t; do echo "- \`${t}\`"; done <<< "${TAGS}"
          } >> "$GITHUB_STEP_SUMMARY"

  helm:
    # After the image, so the chart never points at an image that is not there.
    needs: [ meta, image ]
    if: github.repository == 'cloudresty/nautiluslb'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # push the chart and its signature to ghcr.io
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Login to GHCR (for cosign)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the chart
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
        run: |
          mkdir -p dist
          helm package deploy/helm/nautiluslb --version "${CHART_VERSION}" --app-version "${TAG}" --destination dist
          ls -l dist

      - name: Push the chart (OCI)
        id: push
        env:
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
          ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "${ACTOR}" --password-stdin <<< "${GITHUB_TOKEN}"
          helm push "dist/nautiluslb-${CHART_VERSION}.tgz" "${CHART_REGISTRY}" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: *\(sha256:[0-9a-f]\{64\}\).*/\1/p' push.log | head -n 1)"
          if [ -z "${digest}" ]; then
            echo "::error::could not read the chart digest from helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign the chart (keyless)
        env:
          CHART_VERSION: ${{ needs.meta.outputs.chart_version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="${CHART_REGISTRY#oci://}/nautiluslb"
          cosign sign --yes "${ref}@${DIGEST}"
          cosign sign-blob --yes --bundle "dist/nautiluslb-${CHART_VERSION}.tgz.sigstore.json" "dist/nautiluslb-${CHART_VERSION}.tgz"
          {
            echo "### Helm chart"
            echo
            echo "\`${CHART_REGISTRY}/nautiluslb\` version \`${CHART_VERSION}\` (\`${ref}@${DIGEST}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the packaged chart
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github-release:
    needs: [ meta, sign-binaries, image, helm ]
    if: github.repository == 'cloudresty/nautiluslb'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.latest }}
          fail_on_unmatched_files: true
          files: |
            dist/nautiluslb-linux-amd64
            dist/nautiluslb-linux-arm64
            dist/nautiluslb-linux-amd64.sigstore.json
            dist/nautiluslb-linux-arm64.sigstore.json
            dist/sha256sums.txt
            dist/sha256sums.txt.sigstore.json
            dist/nautiluslb-linux-amd64.spdx.json
            dist/nautiluslb-linux-arm64.spdx.json
            dist/nautiluslb-*.tgz
            dist/nautiluslb-*.tgz.sigstore.json
